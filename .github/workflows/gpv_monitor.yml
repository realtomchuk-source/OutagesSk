name: GPV Schedule Monitor

on:
  schedule:
    # Активний режим кожні 20 хвилин (з урахуванням зміщення від пікових :00/:30)
    # Завдяки smart-skip у gpv_collector.py:
    # - вдень скрипт перевіряє сайт раз на годину (інтервал >= 40 хв)
    # - ввечері при очікуванні завтрашнього графіка перевіряє кожні 20 хв
    # - щойно графік знайдено — переходить у погодинний режим (>= 45 хв)
    # - вночі пропускає зайві запуски (інтервал >= 240 хв)
    - cron: '8,28,48 * * * *'
  workflow_dispatch:

env:
  TZ: Europe/Kyiv

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-gpv-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run GPV Collector
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python gpv_collector.py --force
          else
            python gpv_collector.py
          fi

      - name: Check for changes in data/gpv
        id: check_changes
        run: |
          git add data/gpv/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Змін у графіках ГПВ немає — коміт та деплой не потрібні."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GPV hourly schedule"
          git pull --rebase -Xtheirs origin main
          git push

      - name: Setup Pages
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.check_changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
