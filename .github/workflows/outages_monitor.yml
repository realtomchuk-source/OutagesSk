name: Outages Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'
    - cron: '30 20 * * *' # 23:30 Kyiv Summer time (UTC+3)
    - cron: '30 21 * * *' # 23:30 Kyiv Winter time (UTC+2)
  workflow_dispatch:

env:
  TZ: Europe/Kyiv

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-and-data-sync
  cancel-in-progress: false

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_deploy: ${{ steps.check_changes.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Collector (Parser)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python collector.py

      - name: Run Formatter (AI & TG)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python formatter.py

      - name: Run GPV Collector (Hourly Schedule Sync)
        run: python gpv_collector.py

      - name: Check for changes
        id: check_changes
        run: |
          git add data/ auth_config.js || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" != "schedule" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Змін у даних немає, але запуск через ${{ github.event_name }} — виконуємо деплой Pages."
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Змін немає — коміт та деплой не потрібні."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update outages and messages"
          git pull --rebase -Xtheirs origin main
          git push

      - name: Prepare Pages directory
        if: steps.check_changes.outputs.should_deploy == 'true'
        run: rm -rf html_dumps __pycache__ scratch

      - name: Setup Pages
        if: steps.check_changes.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.check_changes.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: run-parser
    if: needs.run-parser.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
